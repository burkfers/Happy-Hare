# Validates that a PR title follows conventional commits: <type>: <subject>
name: "Enforce PR Type"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-pr-title:
    # Skip PRs opened before this workflow existed, so that touching one
    # doesn't force its author to rename it. GitHub renders pull_request
    # .created_at as a UTC ISO 8601 string, so the comparison below is a
    # lexicographic one. This timestamp is the moment the rule took effect.
    if: github.event.pull_request.created_at > '2026-09-25T17:20:10Z'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Title Prefix
        id: pr-title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Permitted types:
          types: |
            feat
            fix
            chore
            docs

      # The action's message only lands in the log, so surface it in the run
      # summary where it's readable without digging through step output. The
      # message embeds the PR title, so it goes through env rather than being
      # interpolated into this script.
      - name: Explain the result
        if: always()
        env:
          MESSAGE: ${{ steps.pr-title.outputs.error_message }}
        run: |
          {
            echo "## PR title check"
            echo
            if [ -n "$MESSAGE" ]; then
              echo "$MESSAGE"
            else
              echo "Title is valid."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
